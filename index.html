<!DOCTYPE html>
<html lang="da" xmlns="http://www.w3.org/1999/html">

<head>
    <meta charset="UTF-8">
    <title>KinoXP</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/seats.css">
</head>

<body>

<h1>KinoXP</h1>

<!-- Filmoversigt -->
<table>
    <thead>
    <tr>
        <th>Titel</th>
        <th>Kategori</th>
        <th>Alder</th>
        <th>Varighed</th>
    </tr>
    </thead>

    <tbody id="movie-list">
    </tbody>
</table>

<p id="empty-message"></p>


<h2>Forestillinger</h2>

<p id="showings-message" role="status"></p>

<table>
    <thead>
    <tr>
        <th>Film</th>
        <th>Sal</th>
        <th>Tidspunkt</th>
        <th>Status</th>
        <th>Handling</th>
    </tr>
    </thead>
    <tbody id="showings-list"></tbody>
</table>

<h2>Vælg sæder</h2>
<div id="theater-seat-maps"></div>
<p id="seats-message" role="status"></p>

<!-- Opret film -->
<h2>Opret film</h2>

<form id="create-movie-form">

    <div>
        <label for="title">Titel</label>
        <input type="text" id="title" required>
    </div>

<div>
    <label for="category"> Kategori</label>
    <input type="text" id="category" required>
</div>

<div>
    <label for="ageLimit">Aldersgrænse</label>
    <input type="number" id="ageLimit" min="0" step="1" required>
</div>
    <div>
    <label for="duration">Varighed i minutter</label>
    <input type="number" id="duration" min="1" step="1" required>
    </div>

    <button type="submit" id="create-movie-button">
    Opret film
    </button>

</form>

<p id="create-movie-message" role="status"></p>

<h1>Biografsale</h1>

<table>
    <thead>
    <tr>
        <th>Navn</th>
        <th>Rækker</th>
        <th>Sæder pr. række</th>
        <th>Kapacitet</th>
    </tr>
    </thead>

    <tbody id="theater-list">
    </tbody>
</table>

<p id="theater-empty-message"></p>
<script src="js/movie.js"></script>
<script src="js/theater.js"></script>
<script src="js/create-movie.js"></script>
<script src="js/seats.js"></script>
<script src="js/Showings.js"></script>
</body>

</html>
