<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <title>KinoXP</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>KinoXP</h1>

<table>
    <thead>
    <tr>
        <th>Titel</th>
        <th>Kategori</th>
        <th>Alder</th>
        <th>Varighed</th>
    </tr>
    </thead>

    <tbody id="movie-list">
    </tbody>
</table>

<p id="empty-message"></p>

<h2>Opret film</h2>

<form id="create-movie-form"></form>
<div>
    <label for="title">Titel</label>
    <input type="text" id="title" required>
</div>

<div>
    <label for="category"> Kategori</label>
    <input type="text" id="category" recuired>
</div>

<div>
    <label for="ageLimit">Aldersgrænse</label>
    <input type="number" id="ageLimit" min="0" step="1" required>
</div>

<h1>Biografsale</h1>

<table>
    <thead>
    <tr>
        <th>Navn</th>
        <th>Rækker</th>
        <th>Sæder pr. række</th>
        <th>Kapacitet</th>
    </tr>
    </thead>

    <tbody id="theater-list">
    </tbody>
</table>

<p id="theater-empty-message"></p>

<script src="js/movie.js"></script>
<script src="js/theater.js"></script>
<script src="js/create-movie.js"></script>
</body>

</html>
